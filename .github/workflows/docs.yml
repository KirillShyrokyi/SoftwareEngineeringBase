name: Publish documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install documentation dependencies
        run: pip install -r requirements.txt

      - name: Prepare source pages
        run: |
          cp README.md docs/index.md
          cp ROADMAP.md docs/roadmap.md
          cp STUDY_SYSTEM.md docs/study-system.md
          sed -i 's|(README.md)|(index.md)|g' docs/roadmap.md docs/study-system.md
          sed -i 's|(ROADMAP.md)|(roadmap.md)|g' docs/study-system.md
          sed -i 's|(STUDY_SYSTEM.md)|(study-system.md)|g' docs/roadmap.md

      - name: Build MkDocs site
        run: mkdocs build --strict --site-dir site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
